[package]
name = "opencrabs-desktop-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.7.9", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CustomEvent", "EventTarget", "HtmlTextAreaElement", "HtmlInputElement", "Window", "Navigator", "Clipboard"] }

# The wasm release artifact is run through `wasm-opt` (binaryen) by `dx build`.
# rustc 1.97 emits DWARF v5 debug sections that binaryen's DWARF reader aborts
# on ("unsupported version of DWARF"), crashing wasm-opt mid-release and forcing
# dx into a non-deterministic unoptimized fallback. Strip debug info from the
# release wasm so wasm-opt sees clean input and actually optimizes. Panic
# backtraces still carry human-readable names via wasm-opt's name section
# (`wasm_opt.keep_names`), not DWARF.
[profile.release]
debug = false
strip = "debuginfo"
lto = true
codegen-units = 1
