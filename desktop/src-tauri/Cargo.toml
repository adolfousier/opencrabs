[package]
name = "opencrabs-desktop"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "Desktop GUI for OpenCrabs — Hermes-style agent workspace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
opencrabs = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
toml_edit = "0.25"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.desktop-release]
channel = "dev"
auto_update_install = false
distribution = "signed-manual"
update_check = true
trunk_version = "0.21.x"
cargo_tauri_version = "2.x"
rust_toolchain = "1.91.0"
