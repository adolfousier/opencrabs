# Regex patterns — all use (?im) for case-insensitive multiline matching.

line_start_re = "(?im)^[\\s\\-*•>]*(?:(?:ok|okay|sure|alright|right|hmm|well|actually|so)\\s*,?\\s+)?(?:now\\s+)?(?:let\\s+me|i['\u2019]ll|let['\u2019]s|i\\s+need\\s+to|i\\s+have\\s+to|i\\s+must|i\\s+should|i\\s+want\\s+to|i['\u2019]d\\s+need\\s+to)\\s+\\w"

# Brief present-continuous work announcement ending the turn with no tool
# call — "Running checks now.", "Checking the logs…", "Rebuilding now:".
# Requires a leading action gerund AND a trailing imminence marker (now / … /
# ... / :) so ordinary sentences that merely open with a gerund ("Reading the
# file is straightforward.") don't match.
work_announcement_re = "(?i)^[\\s\\-*•>]*(?:(?:(?:and\\s+)?then|next|after\\s+that|followed\\s+by|and)[,]?\\s+)?(?:(?:ok|okay|sure|alright|right|got it|will do|on it)[,.!:]?\\s+)?(?:i['’]?m\\s+|i\\s+am\\s+|now\\s+|let\\s+me\\s+)?(?:re-?)?(?:running|checking|building|rebuilding|testing|fetching|pushing|pulling|committing|updating|fixing|installing|compiling|verifying|validating|searching|scanning|reading|writing|creating|generating|deleting|removing|applying|deploying|merging|rebasing|cloning|downloading|uploading|executing|launching|starting|investigating|inspecting|analy[sz]ing|gathering|loading|reloading|syncing|registering|enabling|disabling)\\b[^.!?:\\n]{0,60}?(?:\\s+(?:right\\s+)?now(?:[.!…,:]+|\\s*(?:\\n|$))|\\.{3}|…|:\\s*(?:\\n|$))"
# Gerund-led plan announcement carrying NO imminence marker — "Setting up the
# plan, then mapping every call site before touching anything." Two reasons
# the patterns above cannot see it (#1261): the verb is a PREPARATION verb
# (mapping, planning, drafting, listing) that work_announcement_re never
# enumerated, and the clause is sequenced with then / before instead of ending
# in now / … / :, which that pattern requires and gerund_re expects at the
# front. Scanned by the zero-tool gate only: once a tool has run, the same
# shape can be a legitimate recap ("Updating the config fixed it, then the
# build passed").
plan_announcement_re = "(?im)^[\\s\\-*•>]*(?:(?:ok|okay|alright|right|sure|got it|will do|on it)[,.!:]?\\s+)?(?:i['’]?m\\s+|i\\s+am\\s+|first\\s+|now\\s+)?(?:setting\\s+up|setting|mapping|planning|drafting|preparing|outlining|sketching|scoping|listing|catalogu?ing|collecting|gathering|documenting|tracing|auditing|reviewing|implementing|refactoring|migrating|wiring|building|creating|writing|updating|fixing|checking|running|reading|searching|scanning|investigating|inspecting|analy[sz]ing)\\b[^.!?\\n]{0,120}?\\b(?:then|before|after\\s+that|next)\\b"


gerund_re = "(?im)(?:^|[.!?]\\s+)\\s*now\\s+(?:re-?)?(?:updating|fixing|committing|amending|pushing|pulling|cherry-picking|merging|rebasing|deploying|redeploying|building|rebuilding|testing|checking|applying|restarting|creating|generating|writing|editing|adding|removing|deleting|reading|running|starting|finishing|finalizing|installing|configuring|wiring|fetching|cloning|downloading|uploading|compiling|verifying|validating|searching|scanning|executing|launching|investigating|inspecting|analy[sz]ing|gathering|loading|reloading|syncing|registering|enabling|disabling)\\b"

trailing_colon_re = "(?im)(?:^|\\n)\\s*(?:let\\s+me|i'll|i\\s+will|now\\s+let\\s+me|now\\s+i'll)\\s+\\w[^:\\n]{0,80}:\\s*$"

now_imperative_re = "(?m)^[\\s\\-*]*(?:now\\s+(?:let\\s+me\\s+)?|let\\s+me\\s+)\\w"

numbered_steps_re = "(?m)^\\s*\\d+\\.\\s+(?:update|fix|modify|create|write|edit|add|change|remove|delete|check|read|run|bump|amend|verify|test|deploy|install)"

past_tense_standalone_re = "(?m)^[\\s\\-*]*(?:amended|updated|fixed|modified|created|written|saved|deleted|removed|replaced|bumped|deployed|committed)[.!]"

path_re = "(?:^|[\\s`(])(?:\\./)?[a-zA-Z_][\\w\\-]*/[\\w\\-/]*\\.\\w{1,6}(?:[\\s`),:;]|$)"

ext_re = "(?:^|[\\s`(])[\\w\\-]+\\.(?:rs|py|ts|tsx|js|jsx|go|sh|toml|yaml|yml|json|md)(?:[\\s`),:;]|$)"

backtick_code_re = "`[a-zA-Z_]\\w+`"

