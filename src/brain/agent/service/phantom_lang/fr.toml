line_start_re = "(?im)^[\\s\\-*•>]*(?:(?:ok|okay|bon|d'accord|bien|oui)\\s*,?\\s+)?(?:maintenant\\s+)?(?:laissez-moi|je vais|allons|j'ai besoin de|je dois|il faut que je|je devrais)\\s+\\w"

# Annonce de travail en cours qui clôt le tour sans appeler d'outil — "Je
# vérifie maintenant.", "Vérification en cours…". Français n'a pas de gérondif-
# statut comme l'anglais, donc on couvre « je <verbe> … maintenant » et le
# nominal « <nom> en cours ». Exige un marqueur d'imminence (maintenant / en
# cours / … / : ).
work_announcement_re = "(?i)^[\\s\\-*•>]*(?:(?:(?:et\\s+)?puis|(?:et\\s+)?ensuite|apr[èe]s\\s+[çc]a|et)[,]?\\s+)?(?:(?:ok|okay|bon|d['’]accord|bien|oui)[,.!:]?\\s+)?(?:(?:je\\s+|j['’])(?:lance|relance|vérifie|exécute|teste|compile|construis|installe|recherche|cherche|lis|écris|crée|génère|corrige|analyse|inspecte|déploie|télécharge|mets à jour)\\b[^.!?:\\n]{0,60}?(?:\\s+maintenant(?:[.!…,:]+|\\s*(?:\\n|$))|\\.{3}|…|:\\s*(?:\\n|$))|(?:lancement|vérification|exécution|compilation|installation|recherche|analyse|déploiement|téléchargement|mise à jour|tests?)\\s+en\\s+cours(?:[.!…,:]+|\\s*(?:\\n|$)))"
# Gerund-led plan announcement carrying NO imminence marker — "Setting up the
# plan, then mapping every call site before touching anything." Two reasons
# the patterns above cannot see it (#1261): the verb is a PREPARATION verb
# (mapping, planning, drafting, listing) that work_announcement_re never
# enumerated, and the clause is sequenced with then / before instead of ending
# in now / … / :, which that pattern requires and gerund_re expects at the
# front. Scanned by the zero-tool gate only: once a tool has run, the same
# shape can be a legitimate recap ("Updating the config fixed it, then the
# build passed").
plan_announcement_re = "(?im)^[\\s\\-*•>]*(?:(?:ok|d['’]accord)[,.!:]?\\s+)?(?:je\\s+vais\\s+|je\\s+|d['’]abord\\s+|maintenant\\s+)?(?:mise\\s+en\\s+place|mets\\s+en\\s+place|cartographie|cartographier|planification|planifie|planifier|préparation|prépare|préparer|révise|réviser|liste|lister|documente|documenter|crée|créer|mets\\s+à\\s+jour|vérifie|vérifier|lecture|lis|lire|analyse|analyser|inspecte|inspecter)\\b[^.!?\\n]{0,120}?\\b(?:puis|ensuite|avant\\s+de|avant\\s+d['’]|après\\s+quoi)\\b"


gerund_re = "(?im)(?:^|[.!?]\\s+)\\s*(?:maintenant|déjà)\\s+(?:vérifiant|mettant à jour|modifiant|corrigeant|réparant|créant|ajoutant|supprimant|exécutant|lisant|cherchant)\\b"

trailing_colon_re = "(?im)(?:^|\\n)\\s*(?:laissez-moi|je vais|maintenant je vais|allons)\\s+\\w[^:\\n]{0,80}:\\s*$"

now_imperative_re = "(?m)^[\\s\\-*]*(?:maintenant\\s+)?(?:laissez-moi|je vais|allons)\\s+\\w"

numbered_steps_re = "(?m)^\\s*\\d+\\.\\s+(?:mettre à jour|modifier|corriger|réparer|créer|ajouter|supprimer|effacer|exécuter|lire|chercher|vérifier)"

past_tense_standalone_re = "(?m)^[\\s\\-*]*(?:mis à jour|modifié|corrigé|réparé|créé|ajouté|supprimé|effacé|exécuté|vérifié|examiné|enregistré|sauvegardé)[.!]"

path_re = "(?:^|[\\s`(])(?:\\./)?[a-zA-Z_][\\w\\-]*/[\\w\\-/]*\\.\\w{1,6}(?:[\\s`),:;]|$)"

ext_re = "(?:^|[\\s`(])[\\w\\-]+\\.(?:rs|py|ts|tsx|js|jsx|go|sh|toml|yaml|yml|json|md)(?:[\\s`),:;]|$)"

backtick_code_re = "`[a-zA-Z_]\\w+`"

